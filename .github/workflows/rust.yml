name: Rust validation

on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - dev

jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          ${{ matrix.os == 'ubuntu-latest'
            && 'sudo apt-get update -q; sudo apt-get install -yq libglib2.0-dev'
            || 'echo "No additional dependencies."'
          }}

      - name: Check fmt
        run: cargo fmt --check

      - name: Cache CEF
        id: cache-cef
        uses: actions/cache@v6.1.0
        with:
          path: ~/.local/share/cef
          key: cef-${{ matrix.os }}-${{ hashFiles('Cargo.toml') }}

      - name: ${{ steps.cache-cef.outputs.cache-hit && 'Use cache' || 'Export CEF' }}
        run: |
          ${{ steps.cache-cef.outputs.cache-hit && 'echo "Cached CEF"'
            || (matrix.os == 'windows-latest'
              && 'cargo run -p export-cef-dir -- "$env:USERPROFILE/.local/share/cef"'
              || 'cargo run -p export-cef-dir -- "$HOME/.local/share/cef"')
          }}
          echo "CEF_PATH=${{ matrix.os == 'windows-latest'
            && '$env:USERPROFILE'
            || '$HOME'
          }}/.local/share/cef" >> "$${{ matrix.os == 'windows-latest'
            && 'env:'
            || ''
          }}GITHUB_ENV"

      - name: Build
        run: cargo build --verbose

      - name: Run tests
        run: cargo test --verbose

  cross-compile-windows:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          # cargo-xwin links with LLVM's lld-link; nothing is compiled from C++
          sudo apt-get update -q
          sudo apt-get install -yq clang lld llvm
          rustup target add x86_64-pc-windows-msvc
          pipx install cargo-xwin
          echo "CARGO_XWIN_VERSION=$(cargo xwin --version | awk '{print $NF}')" >> "$GITHUB_ENV"

      # Only the SDK itself: cargo-xwin symlinks `clang-cl` to the `clang` found on PATH
      # next to it, and that must be recreated for the toolchain installed above. The
      # SDK and CRT versions come from the cargo-xwin release, so key on it.
      - name: Cache Windows SDK
        uses: actions/cache@v6.1.0
        with:
          path: ~/.cache/cargo-xwin/xwin
          key: cargo-xwin-sdk-${{ runner.os }}-${{ env.CARGO_XWIN_VERSION }}

      - name: Build
        run: cargo xwin build -p cefsimple --target x86_64-pc-windows-msvc --verbose

  # Kurogane is tetsu's acceptance suite: its CI's clippy and tests run on
  # this tetsu, through a path patch that lives only in this job
  kurogane:
    name: Kurogane on this tetsu (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    runs-on: ${{ matrix.os }}

    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v7
        with:
          path: tetsu

      - uses: actions/checkout@v7
        with:
          repository: 0x48piraj/kurogane
          path: kurogane

      - name: Install dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq pkg-config libssl-dev

      - name: Patch Kurogane onto this tetsu
        run: |
          TETSU="$GITHUB_WORKSPACE/tetsu"
          PATCH='patch."https://github.com/kurogane-rs/tetsu"'
          # TOML literal strings, so a Windows path's backslashes stay as they are
          {
            printf "PATCH_ARGS=--config %s.tetsu.path='%s'" "$PATCH" "$TETSU/cef"
            printf " --config %s.tetsu-sys.path='%s'" "$PATCH" "$TETSU/sys"
            printf " --config %s.tetsu-download.path='%s'" "$PATCH" "$TETSU/download-cef"
            printf " --config %s.tetsu-build.path='%s'\n" "$PATCH" "$TETSU/tetsu-build"
          } >> "$GITHUB_ENV"

      # A patch Kurogane leaves unused, or a tetsu crate it still takes from
      # git, means the job tests another tetsu
      - name: Check that Kurogane takes every tetsu crate from this tetsu
        working-directory: kurogane
        run: |
          cargo metadata --format-version 1 $PATCH_ARGS 2>&1 > "$RUNNER_TEMP/metadata.json" \
            | tee "$RUNNER_TEMP/metadata.log"
          if grep -q "was not used in the crate graph" "$RUNNER_TEMP/metadata.log" \
            || grep -q '"id":"git+https://github.com/kurogane-rs/tetsu' "$RUNNER_TEMP/metadata.json"; then
            echo "Kurogane takes a tetsu crate from elsewhere, or leaves a patch unused"
            exit 1
          fi

      - name: Clippy
        working-directory: kurogane
        run: |
          cargo clippy -p kurogane -p kurogane-build -p kurogane-layout -p kurogane-cli --all-targets \
            $PATCH_ARGS -- -D warnings

      - name: Test
        working-directory: kurogane
        run: |
          cargo test -p kurogane --lib $PATCH_ARGS
          cargo test -p kurogane-layout -p kurogane-cli $PATCH_ARGS
