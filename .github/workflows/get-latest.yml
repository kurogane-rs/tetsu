name: Get latest CEF version

# Moves tetsu to the newest stable CEF on every target, regenerates the
# bindings and opens a pull request against dev for review. Nothing is pushed
# to dev and nothing is tagged; tetsu is tagged by hand, in pairs with
# Kurogane.

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  get-latest:
    if: github.repository == 'kurogane-rs/tetsu'
    runs-on: ubuntu-latest
    outputs:
      updated: ${{ steps.push-changes.outputs.updated }}
      commit-message: ${{ steps.check-updates.outputs.commit-message }}

    steps:
      - uses: actions/checkout@v7
        with:
          ref: dev
          fetch-depth: 0

      - name: Check for updates
        id: check-updates
        run: cargo run -p get-latest -- --update-version

      - name: Push changes
        id: push-changes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMIT_MESSAGE: ${{ steps.check-updates.outputs.commit-message }}
        run: |
          if [ "${{ steps.check-updates.outputs.updated }}" != "true" ]; then
            echo "updated=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # The branch starts at dev; the change goes on it as a commit GitHub
          # signs
          RESET_REV=$(git rev-parse HEAD)
          git switch -c get-latest
          git push --force -u origin get-latest

          base64 -w0 Cargo.toml > Cargo.toml.base64
          gh api graphql \
            -F githubRepository=${GITHUB_REPOSITORY} \
            -F branchName=get-latest \
            -F expectedHeadOid=${RESET_REV} \
            -F "commitMessage=${COMMIT_MESSAGE}" \
            -F query=@.github/api/createCommitOnBranch.graphql \
            -F "files[][path]=Cargo.toml" \
            -F "files[][contents]=@Cargo.toml.base64"

          echo "updated=true" >> "$GITHUB_OUTPUT"

  update-bindings:
    needs: get-latest
    if: needs.get-latest.outputs.updated == 'true'
    uses: ./.github/workflows/update-bindings.yml
    with:
      branch: "get-latest"

  publish-pr:
    runs-on: ubuntu-latest
    needs:
      - get-latest
      - update-bindings
    if: needs.update-bindings.outputs.published == 'false'

    steps:
      - uses: actions/checkout@v7
        with:
          ref: get-latest
          fetch-depth: 0

      - name: Publish PR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMIT_MESSAGE: ${{ needs.get-latest.outputs.commit-message }}
        run: |
          for attempt in 1 2 3; do
            if gh pr create --base dev --head get-latest -t "${COMMIT_MESSAGE}" -b ""; then
              break
            fi

            if [ "${attempt}" -eq 3 ]; then
              echo "Failed to publish PR after ${attempt} attempts"
              exit 1
            fi

            echo "gh pr create failed, retrying..."
            sleep $((attempt * 5))
          done
