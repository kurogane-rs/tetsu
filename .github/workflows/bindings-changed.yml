name: Bindings changed

on:
  push:
    branches:
      - dev
    paths:
      - Cargo.toml
      - sys/wrapper.h
      - update-bindings/**
      - .github/workflows/bindings-changed.yml
      - .github/workflows/update-bindings.yml

permissions:
  contents: write
  pull-requests: write

jobs:
  update-bindings:
    if: github.repository == 'kurogane-rs/tetsu'
    uses: ./.github/workflows/update-bindings.yml
    with:
      branch: "dev"
