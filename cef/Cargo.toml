[package]
name = "tetsu"
description = "Rust bindings to the Chromium Embedded Framework"

version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[features]
default = ["resources"]
resources = []

# Rust ports of CEF's C++ wrapper, such as its message router and resource manager
wrapper = []

# Unified texture import system for CEF hardware acceleration
accelerated_osr = [
    "ash",
    "libc",
    "objc2-foundation",
    "objc2-io-surface",
    "objc2-metal",
    "thiserror",
    "tracing",
    "wgpu",
    "windows",
]

[dependencies]
tetsu-sys.workspace = true

# accelerated_osr
ash = { workspace = true, optional = true }
thiserror = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }
wgpu = { workspace = true, optional = true }

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys.workspace = true
windows = { workspace = true, optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
libloading.workspace = true
objc2.workspace = true
objc2-foundation = { workspace = true, optional = true }
objc2-io-surface = { workspace = true, optional = true }
objc2-metal = { workspace = true, optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
libc = { workspace = true, optional = true }
